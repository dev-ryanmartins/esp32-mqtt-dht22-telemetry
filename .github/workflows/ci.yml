name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Validate Python receiver and ESP32 firmware
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install receiver dependencies
        run: python -m pip install -r python_receiver/requirements.txt

      - name: Compile Python receiver
        run: python -m py_compile python_receiver/receiver.py

      - name: Setup PlatformIO
        run: python -m pip install platformio

      - name: Build ESP32 firmware
        run: pio run
        working-directory: esp32
